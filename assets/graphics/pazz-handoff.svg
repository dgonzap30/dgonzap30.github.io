<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">PAZZ marketplace handoff map</title>
  <desc id="desc">Discovery, quoting, prequalification, routing, and operations share one rule authority and return failures to an owned recovery lane.</desc>
  <rect width="760" height="420" fill="#faf7f0"/>
  <path d="M36 36h688v348H36z" fill="none" stroke="#c6bdaf"/>
  <g font-family="Instrument Sans, sans-serif" font-weight="700" letter-spacing="1.2">
    <text x="52" y="64" fill="#606872" font-size="10">PAZZ / SANITIZED HANDOFF MAP</text>
    <text x="52" y="108" fill="#315a7d" font-size="11">SHARED RULE AUTHORITY</text>
  </g>
  <path d="M52 126H708" stroke="#315a7d" stroke-width="3"/>
  <g fill="#315a7d"><circle cx="100" cy="126" r="4"/><circle cx="238" cy="126" r="4"/><circle cx="380" cy="126" r="4"/><circle cx="522" cy="126" r="4"/><circle cx="660" cy="126" r="4"/></g>
  <path d="M100 126v54M238 126v54M380 126v54M522 126v54M660 126v54" stroke="#c6bdaf"/>
  <path d="M100 212H660" stroke="#242b36" stroke-width="2"/>
  <path d="m650 205 10 7-10 7" fill="none" stroke="#242b36" stroke-width="2"/>
  <g font-family="Instrument Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#242b36">
    <g transform="translate(100 212)"><rect x="-50" y="-32" width="100" height="64" fill="#f2ede3" stroke="#c6bdaf"/><text y="5">DISCOVER</text><text y="52" fill="#606872" font-size="9">01</text></g>
    <g transform="translate(238 212)"><rect x="-50" y="-32" width="100" height="64" fill="#f2ede3" stroke="#c6bdaf"/><text y="5">QUOTE</text><text y="52" fill="#606872" font-size="9">02</text></g>
    <g transform="translate(380 212)"><rect x="-56" y="-32" width="112" height="64" fill="#f2ede3" stroke="#c6bdaf"/><text y="5">PREQUALIFY</text><text y="52" fill="#606872" font-size="9">03</text></g>
    <g transform="translate(522 212)"><rect x="-50" y="-32" width="100" height="64" fill="#f2ede3" stroke="#c6bdaf"/><text y="5">ROUTE</text><text y="52" fill="#606872" font-size="9">04</text></g>
    <g transform="translate(660 212)"><rect x="-50" y="-32" width="100" height="64" fill="#f2ede3" stroke="#c6bdaf"/><text y="5">OPERATE</text><text y="52" fill="#606872" font-size="9">05</text></g>
  </g>
  <path d="M660 244v74H162" fill="none" stroke="#bd4633" stroke-width="2"/>
  <path d="m172 311-10 7 10 7" fill="none" stroke="#bd4633" stroke-width="2"/>
  <rect x="52" y="292" width="110" height="52" fill="#171c23"/>
  <text x="107" y="314" text-anchor="middle" fill="#f2ede3" font-family="Instrument Sans, sans-serif" font-size="10" font-weight="700">OWNED</text>
  <text x="107" y="329" text-anchor="middle" fill="#e3725f" font-family="Instrument Sans, sans-serif" font-size="10" font-weight="700">RECOVERY</text>
  <text x="184" y="338" fill="#606872" font-family="Instrument Sans, sans-serif" font-size="10">FAILED HANDOFFS RETURN TO AN OPERATING STATE</text>
  <circle cx="660" cy="318" r="5" fill="#bd4633"/>
</svg>
